name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # M7 accept gate (AUDIT.md F6), pinned to the version verified in the
      # I0 audit. shellcheck/pyflakes are explicitly disabled so CI enforces
      # exactly the rule set that verification covered; turning them on is
      # I3/I4 hardening once their findings are triaged.
      - name: actionlint over workflows and ci-templates
        uses: docker://rhysd/actionlint:1.7.1
        with:
          args: >-
            -shellcheck= -pyflakes=
            .github/workflows/ci.yml
            .github/workflows/nightly.yml
            .github/workflows/changesets.yml
            .github/workflows/release.yml
            .github/workflows/smoke.yml
            .github/workflows/vscode-extension.yml
            ci-templates/codemap.yml
            ci-templates/digest.yml
            ci-templates/memory-review.yml
            ci-templates/flightdeck.yml
            ci-templates/distill.yml
            ci-templates/lint.yml
            ci-templates/sessions-rotation.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm bench

  # The VSIX is built from a manifest that no unit test can fully validate
  # (contribution points, activation events, the ignore list). Packaging it on
  # every PR keeps a broken manifest from being discovered at tag time, when
  # the only fix is another version number.
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package the extension
        run: pnpm --filter teambrain-vscode run package

      # Belt and braces around the packaging tests: assert on the real archive
      # that no source and no node_modules leaked into it.
      - name: The VSIX contains only the bundle and its docs
        working-directory: packages/vscode
        run: |
          unzip -l teambrain-vscode.vsix
          if unzip -l teambrain-vscode.vsix | grep -qE 'node_modules|extension/src/|\.node$'; then
            echo 'VSIX contains sources, node_modules, or a native binary'
            exit 1
          fi
